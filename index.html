<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web - Azul</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navegación Azul -->
    <nav class="navbar navbar-expand-sm navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-compass me-2"></i>Mi Sitio
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active fw-semibold" aria-current="page" href="index.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="columna.html">Columnas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tarjetas.html">Tarjetas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Deshabilitado</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Encabezado de bienvenida -->
    <header class="bg-primary bg-gradient text-white py-4 mb-4 shadow-sm">
        <div class="container text-center">
            <h1 class="h3 fw-bold m-0">Portal de Contenido</h1>
            <p class="small m-0 text-white-50">Explora la ubicación y nuestros videos destacados</p>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-4">
        <div class="row g-4">
            
            <!-- Sección de Mapa -->
            <div class="col-12 col-lg-6">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-header bg-white border-start border-primary border-4 py-3">
                        <h2 class="h5 mb-0 text-primary fw-bold">Ubicación Interactiva</h2>
                    </div>
                    <div class="card-body p-3">
                        <div class="ratio ratio-16x9 rounded overflow-hidden mb-3">
                            <iframe src="https://www.openstreetmap.org/export/embed?bbox=-80.75113177299501%2C-0.9579492314748267%2C-80.74928373098375%2C-0.956562722946692&amp;layer=mapnik" title="Mapa OpenStreetMap"></iframe>
                        </div>
                        <div class="text-end">
                            <a href="https://www.openstreetmap.org/#map=19/-0.957256/-80.750208" target="_blank" rel="noopener noreferrer" class="btn btn-outline-primary btn-sm rounded-pill">
                                Ver mapa completo &rarr;
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sección de Video -->
            <div class="col-12 col-lg-6">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-header bg-white border-start border-primary border-4 py-3">
                        <h2 class="h5 mb-0 text-primary fw-bold">Video Promocional</h2>
                    </div>
                    <div class="card-body p-3">
                        <div class="ratio ratio-16x9 rounded overflow-hidden">
                            <iframe src="https://www.youtube.com/embed/hCXFTKg75-Y?si=moLW9cCD2VMuu-ZV" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Azul Oscuro -->
    <footer class="bg-dark text-white py-4 mt-5 border-top border-primary border-3">
        <div class="container text-center">
            <p class="small mb-0 text-secondary">&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
